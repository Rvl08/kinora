version: 2
updates:
  # Keeps the SHA-pinned actions current; Dependabot rewrites the version comments too.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      web-tooling:
        patterns: ['*']
    ignore:
      # TypeScript 7 is not supported by typescript-eslint yet (pinned to 6.x in P0-03).
      # Remove once typescript-eslint supports it.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # Node's type definitions follow the runtime we run (.nvmrc, Node 24);
      # newer majors describe APIs that Node 24 does not have.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
