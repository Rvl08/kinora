version: 2
updates:
  # Keeps the SHA-pinned actions current; Dependabot rewrites the version comments too.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      web-tooling:
        patterns: ['*']
