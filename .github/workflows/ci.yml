# Continuous integration: formatting, lints, tests and licence policy.
#
# Third-party actions are pinned to full commit SHAs (supply-chain safety);
# the trailing comment names the release. Update them together with the
# comment.

name: CI

on:
  push:
    # wip/* branches are where Claude iterates against CI before the owner
    # opens a pull request (Smart App Control blocks local Rust builds).
    branches: [main, 'wip/**']
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, so new RustSec advisories surface even without code changes.
    - cron: '0 2 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        # Reads rust-toolchain.toml.
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Each step tees its output so a failure can be reported as public
      # annotations: job logs need a signed-in user, annotations do not. The
      # fmt and drift diffs are then directly applicable patches, which
      # matters on machines where Smart App Control blocks rustfmt and
      # freshly built generators (CLAUDE.md §5).
      - name: Formatting
        run: |
          cargo fmt --all --check 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\fmt.log"
          exit $LASTEXITCODE
      - name: Clippy
        run: |
          cargo clippy --workspace --all-targets --locked -- -D warnings 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\clippy.log"
          exit $LASTEXITCODE
      - name: Tests
        run: |
          cargo test --workspace --locked 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\test.log"
          exit $LASTEXITCODE
      # cargo test already fails on drift; this step says which generated
      # file is stale and publishes the diff to apply.
      - name: Generated IPC bindings and project schema are current
        if: success() || failure()
        run: |
          cargo run -p kinora-ipc --example generate --locked
          git diff --exit-code -- apps/desktop/ui/src/lib/ipc/bindings.ts crates/kinora-project/schema 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\drift.diff"
          exit $LASTEXITCODE
      - name: Report a failure as annotations
        if: failure()
        run: node scripts/ci/report-failure.mjs "$env:RUNNER_TEMP\fmt.log" "$env:RUNNER_TEMP\clippy.log" "$env:RUNNER_TEMP\test.log" "$env:RUNNER_TEMP\drift.diff"

  web:
    name: Web (lint, format, licences, UI check, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs the pnpm named by package.json's packageManager field.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm run licenses:check
      # Desktop UI (docs/07-frontend-guidelines.md §13).
      - run: pnpm run ui:check
      - run: pnpm run ui:test
      - run: pnpm run ui:build

  ffmpeg:
    name: FFmpeg (fetch, licence verify)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Cache pinned archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor/.cache/*.zip
          key: ffmpeg-${{ hashFiles('scripts/ffmpeg/lock.json') }}
      # Development mode: ship blockers are reported, not failed. The release
      # pipeline runs `verify.mjs --ship` against Kinora's own build (P0-05b).
      - name: Fetch and verify
        run: node scripts/ffmpeg/fetch.mjs

  cargo-deny:
    name: cargo-deny (${{ matrix.checks }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        checks:
          - licenses bans sources
          - advisories
    # A new advisory in a dependency must not block unrelated pull requests;
    # the weekly scheduled run and push to main still report it.
    continue-on-error: ${{ matrix.checks == 'advisories' && github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check ${{ matrix.checks }}

  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Every commit carries Signed-off-by
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for sha in $(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA"); do
            if ! git show -s --format=%B "$sha" | grep -q '^Signed-off-by: '; then
              echo "::error::Commit $sha has no Signed-off-by line (use git commit -s)."
              missing=1
            fi
          done
          exit "$missing"

  workflows:
    name: Workflow lint (actionlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
