[workspace]
resolver = "3"
members = ["crates/*"]
# Phase 0 prototypes are throwaway and build on their own.
exclude = ["spikes"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Rvl08/kinora"
publish = false

[workspace.dependencies]
kinora-core = { path = "crates/kinora-core" }
kinora-ipc = { path = "crates/kinora-ipc" }
kinora-project = { path = "crates/kinora-project" }

serde = { version = "1.0.229", features = ["derive"] }
# `float_roundtrip`: a saved f64 reads back bit for bit (docs/spikes/P0-12-report.md).
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
thiserror = "2.0.21"
uuid = { version = "1.28.0", features = ["v7", "serde"] }

# Code generators are pinned exactly: their output is checked in and compared
# byte for byte by tests, so an upgrade must be a deliberate, reviewed diff.
schemars = { version = "=1.2.3", features = ["uuid1"] }
ts-rs = { version = "=12.0.1", default-features = false, features = ["serde-compat", "no-serde-warnings", "uuid-impl"] }

# Test-only.
jsonschema = { version = "0.59.0", default-features = false }
proptest = "1.12.0"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "warn"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "warn"
undocumented_unsafe_blocks = "deny"
unwrap_used = "warn"
