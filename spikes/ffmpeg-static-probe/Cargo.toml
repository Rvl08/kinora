[package]
name = "ffmpeg-static-probe"
description = "P0-05b: proves the static release FFmpeg links into a Rust executable and works. Throwaway."
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

# Standalone: not a member of the repository workspace.
[workspace]

[dependencies]
# `static`: link avcodec.lib & co. from FFMPEG_DIR (see .cargo/config.toml)
# instead of import libraries. No `device` feature: the release build has no
# libavdevice.
ffmpeg-next = { version = "8.1.0", default-features = false, features = [
  "static",
  "codec",
  "format",
  "filter",
  "software-scaling",
  "software-resampling",
] }
serde_json = "1.0.154"

[build-dependencies]
serde_json = "1.0.154"
