[package]
name = "s1-preview"
description = "Phase 0 Spike S1: Rust demux -> WebCodecs -> WebGPU preview. Throwaway."
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

# Standalone: not a member of the repository workspace.
[workspace]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tauri = { version = "2.12.4", features = [] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ffmpeg-next = { version = "8.1.0", default-features = false, features = ["codec", "format", "software-resampling"] }
cpal = "0.18.2"
rtrb = "0.3"
wgpu = "30.0.1"
pollster = "1.0.1"
bytemuck = { version = "1.25.2", features = ["derive"] }
sysinfo = "0.37"

[features]
# `tauri build` turns this on; benchmarks run `cargo run --release --features custom-protocol`
# against the built front end in ../dist.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
debug = 1
